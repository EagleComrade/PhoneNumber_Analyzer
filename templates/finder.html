<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Number Finder</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-image: url( '{{ url_for("static", filename="imgs/bg_img.webp") }}');
           /* background-color: #24292e;  GitHub dark background */
            color: #ffffff;
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #2c2f33; /* Slightly lighter background */
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 400px; /* Fixed width for better alignment */
        }
        h1 {
            margin-bottom: 20px;
            font-size: 24px;
        }
        input[type="tel"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #444c56; /* Darker border */
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 16px;
            background-color: #3a3f43; /* Input background */
            color: #e7dcdc; /* Input text color */
        }
        input[type="tel"]::placeholder {
            color: #b0b0b0; /* Placeholder color */
        }
        input[type="submit"] {
            background-color: #28a745; /* GitHub green */
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        input[type="submit"]:hover {
            background-color: #218838; /* Darker green on hover */
        }
        .image-container {
            margin-bottom: 20px;
        }
        img {
            max-width: 20%;
            height: auto;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="image-container">
        <img src="{{ url_for('static', filename='imgs/icon_img.webp') }}" alt="Phone Number Finder">
    </div>
    <h1>Find Phone Number Details</h1>
    <form action="#" method="get">
        <input type="tel" name="phoneNumber" id="phoneNumber" placeholder="Enter Phone Number"  pattern="[0-9+()-\s]{10,15}" required>
        <input type="submit" value="Find">
    </form>
</div>

</body>
</html>
